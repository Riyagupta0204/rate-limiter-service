# Runs the whole system with one command:  docker compose up --build
#
# Two services on a shared private network. The app finds Redis by the service
# name "redis" (Docker Compose provides DNS), which is why application.yml reads
# REDIS_HOST from an env var — set to "redis" here, defaulting to localhost otherwise.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"          # exposed so you can also poke Redis from your host
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .                 # build the image from the Dockerfile in this folder
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis      # <-- talk to the "redis" service, not localhost
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy   # wait until Redis passes its healthcheck
