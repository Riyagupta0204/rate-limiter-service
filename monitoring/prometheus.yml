global:
  scrape_interval: 5s       # pull metrics from every target every 5 seconds
  evaluation_interval: 5s

scrape_configs:
  - job_name: rate-limiter-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app:8080          # "app" = Docker Compose service name; resolves on internal network
